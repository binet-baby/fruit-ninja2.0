name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "11090757"

      - name: Install Dependencies (Safe Fallback)
        run: |
          if [ -f "fruit-ninja2.0/package.json" ]; then
            cd fruit-ninja2.0 && npm install
          elif [ -f "package.json" ]; then
            npm install
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Build Web Assets / Capacitor Sync
        run: |
          if [ -d "fruit-ninja2.0" ]; then
            cd fruit-ninja2.0
            npm run build || echo "No build script"
            npx cap sync android || echo "No capacitor sync"
          else
            npm run build || echo "No build script"
            npx cap sync android || echo "No capacitor sync"
          fi

      - name: Make Gradle Wrapper Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} +

      - name: Build Debug APK
        run: |
          if [ -d "fruit-ninja2.0/android" ]; then
            cd fruit-ninja2.0/android && ./gradlew assembleDebug
          elif [ -d "android" ]; then
            cd android && ./gradlew assembleDebug
          else
            ./gradlew assembleDebug
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
