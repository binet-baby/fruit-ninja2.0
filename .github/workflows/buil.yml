<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spooky Fruit Slicer</title>
  <link rel="stylesheet" href="index.css">
  <link href="https://fonts.googleapis.com/css2?family=Creepster&display=swap" rel="stylesheet">
</head>
<body>

  <div class="game-viewport">
    <!-- Top Score & Timer HUD -->
    <header class="game-header">
      <div class="score-box">
        <div class="score-row">
          <img src="crop_apple.png" alt="Score Icon">
          <span id="current-score">124</span>
        </div>
        <span class="best-score">BEST: 458</span>
      </div>
      <div class="timer-box" id="game-timer">00:45</div>
    </header>

    <!-- Active Spawned Monster Fruits -->
    <div class="monster-fruit fruit-apple" style="top: 220px; left: 440px;"></div>
    <div class="monster-fruit fruit-banana" style="top: 200px; left: 650px;"></div>
    <div class="monster-fruit fruit-pineapple" style="top: 480px; left: 220px;"></div>
    <div class="monster-fruit fruit-kiwi" style="top: 600px; left: 680px;"></div>

    <!-- Bottom HUD Footer -->
    <footer class="game-footer">
      <div class="skull-indicator"></div>
    </footer>
  </div>

</body>
</html>
