name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Project and Build APK
        run: |
          # Navigate into the subfolder if it exists
          if [ -d "fruit-ninja2.0" ]; then
            cd fruit-ninja2.0
          fi

          # Create package.json if missing
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # Install Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android --save

          # Initialize Capacitor config safely without invalid flags
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Spooky Fruit" "com.spooky.fruit" --web-dir "."
          fi

          # Add Android platform and sync
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

          # Build Debug APK
          cd android
          chmod +x gradlew
          ./
