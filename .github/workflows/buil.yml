name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Project and Build APK
        run: |
          set -e

          # Navigate into the subfolder if it exists
          if [ -d "fruit-ninja2.0/fruit-ninja2.0" ]; then
            cd fruit-ninja2.0/fruit-ninja2.0
          elif [ -d "fruit-ninja2.0" ]; then
            cd fruit-ninja2.0
          fi

          # Create package.json if missing
          if [ ! -f "package.json" ]; then
            npm init -y
          fi

          # Install latest Capacitor packages
          npm install @capacitor/core@latest @capacitor/cli@latest @capacitor/android@latest --save

          # Create 'www' folder for web assets and copy files into it
          mkdir -p www
          find . -maxdepth 1 \( -name "*.html" -o -name "*.css" -o -name "*.js" -o -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) -exec cp {} www/ \;

          # Initialize Capacitor config with 'www' as the web-dir if missing
          if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
            npx cap init "Spooky Fruit" "com.spooky.fruit" --web-dir "www"
          fi

          # Add Android platform and sync if missing
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Upgrade Gradle wrapper to version 8.13
          if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip|g' android/gradle/wrapper/gradle-wrapper.properties
          fi

          npx cap sync android

          # Build Debug APK with JDK 21
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
