<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fruit Ninja 2.0 — Horror Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="game-canvas"></canvas>

        <!-- Horror Corner Decorations -->
        <div class="horror-corner corner-tl" aria-hidden="true">💀</div>
        <div class="horror-corner corner-tr" aria-hidden="true">🦇</div>
        <div class="horror-corner corner-bl" aria-hidden="true">🪦</div>
        <div class="horror-corner corner-br" aria-hidden="true">💀</div>

        <!-- UI Overlay -->
        <div id="ui-layer">
            <div id="hud" class="hidden">
                <div class="hud-pill score-board">
                    <span class="hud-label">SCORE</span>
                    <span id="score" class="hud-value">0</span>
                </div>
                <div class="hud-pill timer-board">
                    <span class="hud-label">TIME</span>
                    <span id="timer" class="hud-value">60</span>
                </div>
            </div>

            <div id="start-screen" class="screen active">
                <div class="arcade-card">
                    <div class="arcade-badge">👻 HORROR EDITION</div>
                    <h1>Fruit Ninja 2.0</h1>
                    <div class="instructions-list">
                        <div class="instruction-item">
                            <span class="item-icon">🍉</span>
                            <span>Swipe to slice the horror fruits</span>
                        </div>
                        <div class="instruction-item">
                            <span class="item-icon">💣</span>
                            <span>Avoid the cursed bombs!</span>
                        </div>
                        <div class="instruction-item">
                            <span class="item-icon">⏱️</span>
                            <span>Survive 60 spooky seconds</span>
                        </div>
                    </div>
                    <button id="start-btn" class="arcade-btn">Play Now 🔪</button>
                </div>
            </div>

            <div id="game-over-screen" class="screen hidden">
                <div class="arcade-card">
                    <div class="arcade-badge game-over-badge">💀 ROUND OVER</div>
                    <h1>Game Over</h1>
                    <div class="final-score-container">
                        <span class="final-score-label">FINAL SCORE</span>
                        <span id="final-score" class="final-score-value">0</span>
                    </div>
                    <p id="game-over-reason" class="game-over-reason">Time's up!</p>
                    <button id="restart-btn" class="arcade-btn">Play Again 👻</button>
                </div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
